name: CI Pipeline

on:
  push:
    branches: [ "main", "feature/*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  backend-tests:
    name: Backend Build & Tests
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET 10.0
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      run: dotnet restore AsistenteAyuntamiento.slnx

    - name: Build
      run: dotnet build AsistenteAyuntamiento.slnx --no-restore --configuration Release

    - name: Run Unit Tests
      run: dotnet test AsistenteAyuntamiento.slnx --no-build --verbosity normal --configuration Release

  frontend-build:
    name: Angular Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AsistenteAyuntamiento.Angular
    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: src/AsistenteAyuntamiento.Angular/package-lock.json

    - name: Install dependencies
      run: npm install --no-audit

    - name: Build Angular App
      run: npm run build -- --configuration production
