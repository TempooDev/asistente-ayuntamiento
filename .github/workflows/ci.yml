name: CI

on:
  push:
    branches: [ "main", "feature/**", "feat/**", "fix/**" ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reject tracked files over 5 MB
        run: |
          # Extended regex of paths allowed to exceed the limit (empty = none).
          allow_list=''
          too_big=''
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            size=$(wc -c < "$f")
            if [ "$size" -gt 5242880 ] && { [ -z "$allow_list" ] || ! echo "$f" | grep -qE "$allow_list"; }; then
              too_big+="$f ($size bytes)"$'\n'
            fi
          done < <(git ls-files -z)
          if [ -n "$too_big" ]; then
            echo "::error::Tracked files over 5 MB:"
            printf '%s' "$too_big"
            exit 1
          fi

  dotnet:
    name: .NET build, format and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore AsistenteAyuntamiento.slnx

      - name: Verify formatting
        run: dotnet format whitespace AsistenteAyuntamiento.slnx --verify-no-changes --no-restore

      # .editorconfig code-style rules at warning or above, including the naming rules (IDE1006) and
      # using placement/order, which the compiler does not report on the command line.
      # CA2254 and CA2016 are errors in .editorconfig, so the Build step fails on them.
      - name: Verify code style and naming
        run: dotnet format style AsistenteAyuntamiento.slnx --verify-no-changes --severity warn --no-restore

      - name: Build
        run: dotnet build AsistenteAyuntamiento.slnx --no-restore --configuration Release

      # Integration tests use Testcontainers (Docker is available on ubuntu-latest runners).
      - name: Test
        run: dotnet test AsistenteAyuntamiento.slnx --no-build --configuration Release --logger "trx" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dotnet-test-results
          path: TestResults
          if-no-files-found: ignore

  angular:
    name: Angular tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/AsistenteAyuntamiento.Angular
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/AsistenteAyuntamiento.Angular/package-lock.json

      # Use the npm version from package.json "packageManager"; npm 10 (bundled with Node 22) rejects this lockfile.
      - name: Install dependencies
        run: |
          npm install -g npm@11.6.2
          npm ci --no-audit

      - name: Unit tests
        run: npx ng test --watch=false

      - name: Production build
        run: npm run build -- --configuration production

  go:
    name: Go vet, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/go-scraper
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go-scraper/go.mod
          cache-dependency-path: src/go-scraper/go.sum

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

      - name: Formatting
        run: |
          unformatted=$(gofmt -l cmd internal)
          if [ -n "$unformatted" ]; then
            echo "::error::Run gofmt -w on:"; echo "$unformatted"; exit 1
          fi

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null ./cmd/scraper

  protos:
    name: Generated protobuf code is up to date
    runs-on: ubuntu-latest
    env:
      PROTOC_VERSION: '33.2'
      PROTOC_GEN_GO_VERSION: 'v1.36.12'
      PROTOC_GEN_GO_GRPC_VERSION: 'v1.6.2'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go-scraper/go.mod
          cache: false

      - name: Install protoc and Go plugins
        run: |
          curl -sSL -o /tmp/protoc.zip "https://github.com/protocolbuffers/protobuf/releases/download/v${PROTOC_VERSION}/protoc-${PROTOC_VERSION}-linux-x86_64.zip"
          sudo unzip -q -o /tmp/protoc.zip -d /usr/local bin/protoc 'include/*'
          go install "google.golang.org/protobuf/cmd/protoc-gen-go@${PROTOC_GEN_GO_VERSION}"
          go install "google.golang.org/grpc/cmd/protoc-gen-go-grpc@${PROTOC_GEN_GO_GRPC_VERSION}"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Regenerate Go code
        working-directory: src/go-scraper
        run: go generate ./internal/protos

      - name: Fail on drift
        run: git diff --exit-code -- src/go-scraper/internal/protos
