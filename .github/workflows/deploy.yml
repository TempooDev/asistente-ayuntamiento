name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ] # Se dispara al mergear en main
    paths:
      - 'src/**'
      - 'docker-compose.yml'
      - '.github/workflows/**'
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Forzar la compilación y despliegue de TODOS los servicios'
        type: boolean
        required: true
        default: true

env:
  REGISTRY: ghcr.io
  # Docker requiere que los nombres de los repositorios estén completamente en minúsculas.
  IMAGE_PREFIX: ghcr.io/tempoodev/asistente-ayuntamiento

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      dotnet_matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_dotnet: ${{ steps.set-matrix.outputs.any }}
      goscraper: ${{ steps.filter.outputs.goscraper == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_all == 'true') }}
      compose: ${{ steps.filter.outputs.compose == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.force_all == 'true') }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ApiService:
              - 'src/AsistenteAyuntamiento.ApiService/**'
              - 'src/AsistenteAyuntamiento.Shared/**'
              - 'src/AsistenteAyuntamiento.ServiceDefaults/**'
            Gateway:
              - 'src/AsistenteAyuntamiento.Gateway/**'
              - 'src/AsistenteAyuntamiento.Angular/**'
              - 'src/AsistenteAyuntamiento.Shared/**'
              - 'src/AsistenteAyuntamiento.ServiceDefaults/**'
            Worker:
              - 'src/AsistenteAyuntamiento.Worker/**'
              - 'src/AsistenteAyuntamiento.Shared/**'
              - 'src/AsistenteAyuntamiento.ServiceDefaults/**'
            goscraper:
              - 'src/go-scraper/**'
            compose:
              - 'docker-compose.yml'
      - id: set-matrix
        run: |
          matrix="[]"
          is_force="${{ github.event_name == 'workflow_dispatch' && github.event.inputs.force_all == 'true' }}"
          
          if [[ "${{ steps.filter.outputs.ApiService }}" == 'true' || "$is_force" == 'true' ]]; then matrix=$(echo $matrix | jq -c '. += ["AsistenteAyuntamiento.ApiService"]'); fi
          if [[ "${{ steps.filter.outputs.Gateway }}" == 'true' || "$is_force" == 'true' ]]; then matrix=$(echo $matrix | jq -c '. += ["AsistenteAyuntamiento.Gateway"]'); fi
          if [[ "${{ steps.filter.outputs.Worker }}" == 'true' || "$is_force" == 'true' ]]; then matrix=$(echo $matrix | jq -c '. += ["AsistenteAyuntamiento.Worker"]'); fi
          
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          if [ "$matrix" != "[]" ]; then echo "any=true" >> $GITHUB_OUTPUT; else echo "any=false" >> $GITHUB_OUTPUT; fi

  build-dotnet:
    needs: changes
    if: needs.changes.outputs.any_dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        project: ${{ fromJSON(needs.changes.outputs.dotnet_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for Angular build (Gateway only)
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular and copy to Gateway wwwroot
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        run: |
          cd src/AsistenteAyuntamiento.Angular
          npm install
          npm run build -- --configuration production
          cd ..
          mkdir -p AsistenteAyuntamiento.Gateway/wwwroot
          cp -r AsistenteAyuntamiento.Angular/dist/AsistenteAyuntamiento.Angular/browser/* AsistenteAyuntamiento.Gateway/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Push Container
        run: |
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            -p:ContainerRepository=tempoodev/asistente-ayuntamiento-${{ matrix.project }} \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerImageTag=latest \
            -t:PublishContainer

  build-go:
    needs: changes
    if: needs.changes.outputs.goscraper == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go Scraper
        uses: docker/build-push-action@v6
        with:
          context: src/go-scraper
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-go-scraper:latest

  trigger-deployment:
    needs: [changes, build-dotnet, build-go]
    environment: production
    # Se ejecuta SIEMPRE que los jobs anteriores no hayan fallado (pueden haber sido 'skipped')
    # Y solo si al menos algo ha cambiado (algún contenedor se ha compilado O cambió el compose)
    if: |
      always() && 
      (needs.build-dotnet.result == 'success' || needs.build-dotnet.result == 'skipped') && 
      (needs.build-go.result == 'success' || needs.build-go.result == 'skipped') &&
      (needs.changes.outputs.any_dotnet == 'true' || needs.changes.outputs.goscraper == 'true' || needs.changes.outputs.compose == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering deployment in Dokploy..."
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/main"}'
