name: Build and Push Docker Images

on:
  push:
    branches: [ "main" ] # Se dispara al mergear en main
    paths:
      - 'src/**'
      - 'docker-compose.yml'
  workflow_dispatch: # Permite lanzar la pipeline manualmente desde la interfaz de GitHub

env:
  REGISTRY: ghcr.io
  # Docker requiere que los nombres de los repositorios estén completamente en minúsculas.
  IMAGE_PREFIX: ghcr.io/tempoodev/asistente-ayuntamiento

jobs:
  build-dotnet:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        project: 
          - AsistenteAyuntamiento.ApiService
          - AsistenteAyuntamiento.Gateway
          - AsistenteAyuntamiento.Worker
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node for Angular build (Gateway only)
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Angular and copy to Gateway wwwroot
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        run: |
          cd src/AsistenteAyuntamiento.Angular
          npm install
          npm run build -- --configuration production
          cd ..
          mkdir -p AsistenteAyuntamiento.Gateway/wwwroot
          cp -r AsistenteAyuntamiento.Angular/dist/AsistenteAyuntamiento.Angular/browser/* AsistenteAyuntamiento.Gateway/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Push Container
        run: |
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            -p:ContainerRepository=tempoodev/asistente-ayuntamiento-${{ matrix.project }} \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            -p:ContainerImageTag=latest \
            -t:PublishContainer

  build-go:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go Scraper
        uses: docker/build-push-action@v6
        with:
          context: src/go-scraper
          push: true
          tags: ${{ env.IMAGE_PREFIX }}-go-scraper:latest

  trigger-deployment:
    needs: [build-dotnet, build-go]
    runs-on: ubuntu-latest
    environment: dokploy-production # Requiere configuración de entorno en GitHub para aprobación manual
    steps:
      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering deployment in Dokploy..."
          curl -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/main"}'
