name: Build and Push Docker Images

on:
  # Deploy only commits on main that passed CI.
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      force_all:
        description: 'Forzar la compilación de TODOS los servicios'
        type: boolean
        required: true
        default: false
      force_api:
        description: 'Forzar ApiService'
        type: boolean
        required: false
        default: false
      force_worker:
        description: 'Forzar Worker'
        type: boolean
        required: false
        default: false
      force_gateway:
        description: 'Forzar Gateway (incluye UI)'
        type: boolean
        required: false
        default: false
      force_go:
        description: 'Forzar Go Scraper'
        type: boolean
        required: false
        default: false

env:
  REGISTRY: ghcr.io
  # Image names must match docker-compose.yml (lowercase, no dots).
  IMAGE_PREFIX: ghcr.io/tempoodev/asistente-ayuntamiento

jobs:
  changes:
    # Manual runs build the selected services of a main commit with a green CI; workflow_run only continues when CI
    # succeeded on a push.
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.meta.outputs.sha }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      dotnet_matrix: ${{ steps.set-matrix.outputs.matrix }}
      any_dotnet: ${{ steps.set-matrix.outputs.any }}
      goscraper: ${{ steps.set-matrix.outputs.goscraper }}
      compose: ${{ steps.set-matrix.outputs.compose }}
    steps:
      # A manual run may only redeploy a main commit that already passed CI on push.
      - name: Require a green CI for manual runs
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Manual deploys only run from main (got $GITHUB_REF)."
            exit 1
          fi
          green=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" --jq '.total_count')
          if [ "$green" -lt 1 ]; then
            echo "::error::CI has not succeeded on push for $SHA; deploy refused."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - id: meta
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "short_sha=${sha:0:7}" >> "$GITHUB_OUTPUT"

      - id: set-matrix
        env:
          IS_DISPATCH: ${{ github.event_name == 'workflow_dispatch' }}
          FORCE_ALL: ${{ github.event.inputs.force_all == 'true' }}
          FORCE_API: ${{ github.event.inputs.force_api == 'true' }}
          FORCE_GATEWAY: ${{ github.event.inputs.force_gateway == 'true' }}
          FORCE_WORKER: ${{ github.event.inputs.force_worker == 'true' }}
          FORCE_GO: ${{ github.event.inputs.force_go == 'true' }}
        run: |
          # Files changed by the commit being deployed (PRs are squash-merged into main).
          if [ "$IS_DISPATCH" = "true" ]; then changed=""; else changed=$(git diff --name-only HEAD^ HEAD); fi
          touched() { echo "$changed" | grep -qE "$1"; }

          shared='^src/AsistenteAyuntamiento\.(Shared|ServiceDefaults)/|^Directory\.(Build|Packages)\.props$'
          backend='^src/AsistenteAyuntamiento\.(Application|Infrastructure|Domain)/'

          matrix='[]'
          add() { matrix=$(echo "$matrix" | jq -c --arg p "$1" --arg i "$2" '. += [{project: $p, image: $i}]'); }

          if touched "^src/AsistenteAyuntamiento\.ApiService/|$backend|$shared" || [ "$FORCE_ALL" = "true" ] || [ "$FORCE_API" = "true" ]; then
            add AsistenteAyuntamiento.ApiService asistente-ayuntamiento-asistenteayuntamiento-apiservice
          fi
          if touched "^src/AsistenteAyuntamiento\.(Gateway|Angular)/|$shared" || [ "$FORCE_ALL" = "true" ] || [ "$FORCE_GATEWAY" = "true" ]; then
            add AsistenteAyuntamiento.Gateway asistente-ayuntamiento-asistenteayuntamiento-gateway
          fi
          if touched "^src/AsistenteAyuntamiento\.Worker/|$backend|$shared" || [ "$FORCE_ALL" = "true" ] || [ "$FORCE_WORKER" = "true" ]; then
            add AsistenteAyuntamiento.Worker asistente-ayuntamiento-asistenteayuntamiento-worker
          fi

          goscraper=false
          if touched '^src/go-scraper/|^src/Protos/' || [ "$FORCE_ALL" = "true" ] || [ "$FORCE_GO" = "true" ]; then goscraper=true; fi
          compose=false
          if touched '^docker-compose\.yml$' || [ "$FORCE_ALL" = "true" ]; then compose=true; fi

          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$matrix" != "[]" ]; then echo "any=true" >> "$GITHUB_OUTPUT"; else echo "any=false" >> "$GITHUB_OUTPUT"; fi
          echo "goscraper=$goscraper" >> "$GITHUB_OUTPUT"
          echo "compose=$compose" >> "$GITHUB_OUTPUT"

  build-dotnet:
    needs: changes
    if: needs.changes.outputs.any_dotnet == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include: ${{ fromJSON(needs.changes.outputs.dotnet_matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Setup Node for Angular build (Gateway only)
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: src/AsistenteAyuntamiento.Angular/package-lock.json

      - name: Build Angular and copy to Gateway wwwroot
        if: matrix.project == 'AsistenteAyuntamiento.Gateway'
        run: |
          cd src/AsistenteAyuntamiento.Angular
          npm install -g npm@11.6.2  # matches package.json "packageManager"
          npm ci --no-audit
          npm run build -- --configuration production
          cd ..
          mkdir -p AsistenteAyuntamiento.Gateway/wwwroot
          cp -r AsistenteAyuntamiento.Angular/dist/AsistenteAyuntamiento.Angular/browser/* AsistenteAyuntamiento.Gateway/wwwroot/

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish and Push Container
        run: |
          dotnet publish src/${{ matrix.project }}/${{ matrix.project }}.csproj \
            -c Release \
            -p:ContainerRepository=tempoodev/${{ matrix.image }} \
            -p:ContainerRegistry=${{ env.REGISTRY }} \
            '-p:ContainerImageTags="sha-${{ needs.changes.outputs.short_sha }};latest"' \
            -t:PublishContainer

  build-go:
    needs: changes
    if: needs.changes.outputs.goscraper == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.changes.outputs.sha }}

      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Go Scraper
        uses: docker/build-push-action@v6
        with:
          context: src/go-scraper
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-go-scraper:sha-${{ needs.changes.outputs.short_sha }}
            ${{ env.IMAGE_PREFIX }}-go-scraper:latest

  trigger-deployment:
    needs: [changes, build-dotnet, build-go]
    environment: production
    # Runs when no build failed (skipped is fine) and something was built or the compose file changed.
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-dotnet.result == 'success' || needs.build-dotnet.result == 'skipped') &&
      (needs.build-go.result == 'success' || needs.build-go.result == 'skipped') &&
      (needs.changes.outputs.any_dotnet == 'true' || needs.changes.outputs.goscraper == 'true' || needs.changes.outputs.compose == 'true')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Dokploy Deployment
        run: |
          echo "Triggering deployment of sha-${{ needs.changes.outputs.short_sha }} in Dokploy..."
          curl -fsS -X POST "${{ secrets.DOKPLOY_WEBHOOK_URL }}" \
            -H "X-GitHub-Event: push" \
            -H "Content-Type: application/json" \
            -d '{"ref": "refs/heads/main"}'
