# Application services. The .NET services read the ConfigMap and the Secret as environment variables; some keys contain
# "-" (ConnectionStrings__asistente-ayuntamiento-db), which needs a cluster that accepts such names in envFrom
# (RelaxedEnvironmentVariableValidation, on by default in recent Kubernetes versions).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apiservice
spec:
  replicas: 1
  selector:
    matchLabels: { app: apiservice }
  template:
    metadata:
      labels: { app: apiservice }
    spec:
      containers:
        - name: apiservice
          image: asistente/apiservice
          ports: [{ name: http, containerPort: 8080 }, { name: grpc, containerPort: 50051 }]
          envFrom:
            - configMapRef: { name: asistente-config }
            - secretRef: { name: asistente-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: apiservice }
            - { name: Kestrel__Endpoints__Http__Url, value: "http://+:8080" }
            - { name: Kestrel__Endpoints__Http__Protocols, value: Http1AndHttp2 }
            - { name: Kestrel__Endpoints__Grpc__Url, value: "http://+:50051" }
            - { name: Kestrel__Endpoints__Grpc__Protocols, value: Http2 }
            - { name: DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT, value: "true" }
            - { name: GoScraper__GrpcUrl, value: "http://go-scraper:50051" }
          # /health is only mapped in Development for public hosts, so the probes check the port.
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 30, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: apiservice
spec:
  selector: { app: apiservice }
  ports:
    - { name: http, port: 8080 }
    - { name: grpc, port: 50051 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-baseline
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-baseline }
  template:
    metadata:
      labels: { app: worker-baseline }
    spec:
      containers:
        - name: worker
          image: asistente/worker
          envFrom:
            - configMapRef: { name: asistente-config }
            - secretRef: { name: asistente-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: worker-baseline }
            - { name: WORKER_PIPELINE_MODE, value: BASELINE }
            - { name: ASPNETCORE_HTTP_PORTS, value: "8080" }
          livenessProbe: { httpGet: { path: /alive, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 30 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-hierarchical
spec:
  replicas: 1
  selector:
    matchLabels: { app: worker-hierarchical }
  template:
    metadata:
      labels: { app: worker-hierarchical }
    spec:
      containers:
        - name: worker
          image: asistente/worker
          envFrom:
            - configMapRef: { name: asistente-config }
            - secretRef: { name: asistente-secrets }
          env:
            - { name: OTEL_SERVICE_NAME, value: worker-hierarchical }
            - { name: WORKER_PIPELINE_MODE, value: HIERARCHICAL }
            - { name: ASPNETCORE_HTTP_PORTS, value: "8080" }
          livenessProbe: { httpGet: { path: /alive, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 30 }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, periodSeconds: 30 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-scraper
spec:
  replicas: 1
  selector:
    matchLabels: { app: go-scraper }
  template:
    metadata:
      labels: { app: go-scraper }
    spec:
      containers:
        - name: go-scraper
          image: asistente/go-scraper
          ports: [{ name: http, containerPort: 8080 }, { name: grpc, containerPort: 50051 }]
          env:
            - { name: OTEL_SERVICE_NAME, value: go-scraper }
            - { name: PORT, value: "8080" }
            - { name: GRPC_PORT, value: "50051" }
            - { name: DOTNET_API_GRPC_URL, value: "http://apiservice:50051" }
            - { name: SCRAPE_SCHEDULED_PROVIDERS, valueFrom: { configMapKeyRef: { name: asistente-config, key: SCRAPE_SCHEDULED_PROVIDERS } } }
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, valueFrom: { configMapKeyRef: { name: asistente-config, key: OTEL_EXPORTER_OTLP_ENDPOINT } } }
            - { name: ConnectionStrings__messaging, valueFrom: { secretKeyRef: { name: asistente-secrets, key: ConnectionStrings__messaging } } }
            - { name: INTERNAL_GRPC_KEY, valueFrom: { secretKeyRef: { name: asistente-secrets, key: INTERNAL_GRPC_KEY } } }
            - { name: Blob__Endpoint, valueFrom: { secretKeyRef: { name: asistente-secrets, key: Blob__Endpoint } } }
            - { name: Blob__AccessKeyId, valueFrom: { secretKeyRef: { name: asistente-secrets, key: Blob__AccessKeyId } } }
            - { name: Blob__SecretAccessKey, valueFrom: { secretKeyRef: { name: asistente-secrets, key: Blob__SecretAccessKey } } }
            - { name: Blob__BucketName, valueFrom: { secretKeyRef: { name: asistente-secrets, key: Blob__BucketName } } }
          readinessProbe: { httpGet: { path: /health, port: http }, periodSeconds: 30 }
---
apiVersion: v1
kind: Service
metadata:
  name: go-scraper
spec:
  selector: { app: go-scraper }
  ports:
    - { name: http, port: 8080 }
    - { name: grpc, port: 50051 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
spec:
  replicas: 1
  selector:
    matchLabels: { app: gateway }
  template:
    metadata:
      labels: { app: gateway }
    spec:
      containers:
        - name: gateway
          image: asistente/gateway
          ports: [{ name: http, containerPort: 8080 }]
          env:
            - { name: ASPNETCORE_ENVIRONMENT, value: Production }
            - { name: ASPNETCORE_HTTP_PORTS, value: "8080" }
            - { name: OTEL_SERVICE_NAME, value: gateway }
            - { name: ReverseProxy__Clusters__apiservice-cluster__Destinations__destination1__Address, value: "http://apiservice:8080" }
            - { name: DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT, value: "true" }
          readinessProbe: { tcpSocket: { port: http }, periodSeconds: 10 }
---
apiVersion: v1
kind: Service
metadata:
  name: gateway
spec:
  selector: { app: gateway }
  ports: [{ name: http, port: 80, targetPort: 8080 }]
