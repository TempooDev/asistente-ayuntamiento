# Template of the Secret the manifests read. Copy to secret.yaml, fill in and apply it on its own:
#   kubectl apply -n asistente-ayuntamiento -f secret.yaml
# It is not listed in kustomization.yaml so no real value ends up in the repository.
apiVersion: v1
kind: Secret
metadata:
  name: asistente-secrets
  namespace: asistente-ayuntamiento
type: Opaque
stringData:
  POSTGRES_DB: "asistente"
  POSTGRES_USER: "asistente"
  POSTGRES_PASSWORD: ""
  RABBITMQ_PASS: ""
  QDRANT_API_KEY: ""
  INTERNAL_GRPC_KEY: ""
  # Connection strings built from the values above.
  ConnectionStrings__asistente-ayuntamiento-db: "Host=postgres;Database=asistente;Username=asistente;Password=<POSTGRES_PASSWORD>"
  ConnectionStrings__qdrant: "Endpoint=http://qdrant:6334;Key=<QDRANT_API_KEY>"
  ConnectionStrings__messaging: "amqp://admin:<RABBITMQ_PASS>@rabbitmq:5672"
  Internal__GrpcApiKey: "<INTERNAL_GRPC_KEY>"
  Ai__Chat__ApiKey: ""
  Ai__Embeddings__ApiKey: ""
  Blob__Endpoint: ""
  Blob__AccessKeyId: ""
  Blob__SecretAccessKey: ""
  Blob__BucketName: "asistente-documents"
  Auth0__Domain: ""
  Auth0__ClientId: ""
  Auth0__ClientSecret: ""
  Auth0__Audience: ""
