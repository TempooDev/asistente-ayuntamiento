services:
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: "admin"
      RABBITMQ_DEFAULT_PASS: "${RABBITMQ_PASS:-SECRETO_RABBIT}"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  apiservice:
    build:
      context: ./src
      dockerfile: AsistenteAyuntamiento.ApiService/Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__asistente-ayuntamiento-db: "Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASS}"
      ConnectionStrings__messaging: "amqp://admin:${RABBITMQ_PASS:-SECRETO_RABBIT}@rabbitmq:5672"
      Ai__Chat__Provider: "google"
      Ai__Chat__Model: "${GEMINI_MODEL}"
      Ai__Chat__ApiKey: "${GEMINI_API_KEY}"
      Ai__Embeddings__Provider: "google"
      Ai__Embeddings__Model: "text-embedding-004"
      Ai__Embeddings__ApiKey: "${GEMINI_API_KEY}"
      Blob__Endpoint: "${CLOUDFLARE_R2_ENDPOINT}"
      Blob__AccessKeyId: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
      Blob__SecretAccessKey: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
      Blob__BucketName: "${CLOUDFLARE_R2_BUCKET_NAME}"
      Auth0__Domain: "${AUTH0_DOMAIN}"
      Auth0__Audience: "${AUTH0_AUDIENCE}"
      ASPNETCORE_HTTP_PORTS: 8080

  worker:
    build:
      context: ./src
      dockerfile: AsistenteAyuntamiento.Worker/Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
      ConnectionStrings__asistente-ayuntamiento-db: "Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASS}"
      ConnectionStrings__messaging: "amqp://admin:${RABBITMQ_PASS:-SECRETO_RABBIT}@rabbitmq:5672"
      Ai__Chat__Provider: "google"
      Ai__Chat__Model: "${GEMINI_MODEL}"
      Ai__Chat__ApiKey: "${GEMINI_API_KEY}"
      Ai__Embeddings__Provider: "google"
      Ai__Embeddings__Model: "text-embedding-004"
      Ai__Embeddings__ApiKey: "${GEMINI_API_KEY}"
      Blob__Endpoint: "${CLOUDFLARE_R2_ENDPOINT}"
      Blob__AccessKeyId: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
      Blob__SecretAccessKey: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
      Blob__BucketName: "${CLOUDFLARE_R2_BUCKET_NAME}"

  go-scraper:
    build:
      context: ./src/go-scraper
      dockerfile: Dockerfile
    restart: always
    depends_on:
      rabbitmq:
        condition: service_healthy
      apiservice:
        condition: service_started
    environment:
      ConnectionStrings__messaging: "amqp://admin:${RABBITMQ_PASS:-SECRETO_RABBIT}@rabbitmq:5672"
      Blob__Endpoint: "${CLOUDFLARE_R2_ENDPOINT}"
      Blob__AccessKeyId: "${CLOUDFLARE_R2_ACCESS_KEY_ID}"
      Blob__SecretAccessKey: "${CLOUDFLARE_R2_SECRET_ACCESS_KEY}"
      Blob__BucketName: "${CLOUDFLARE_R2_BUCKET_NAME}"
      DOTNET_API_GRPC_URL: "apiservice:8080"

  gateway:
    build:
      context: ./src
      dockerfile: AsistenteAyuntamiento.Gateway/Dockerfile
    restart: always
    depends_on:
      webfrontend:
        condition: service_started
      apiservice:
        condition: service_started
    environment:
      services__apiservice__http__0: "http://apiservice:8080"
      services__webfrontend__http__0: "http://webfrontend:80"
      ASPNETCORE_HTTP_PORTS: 80
      ReverseProxy__Clusters__apiservice-cluster__Destinations__destination1__Address: "http://apiservice:8080"
      ReverseProxy__Clusters__web-cluster__Destinations__destination1__Address: "http://webfrontend:80"

  webfrontend:
    build:
      context: ./src/AsistenteAyuntamiento.Angular
      dockerfile: Dockerfile
      args:
        - Auth0__Domain=${AUTH0_DOMAIN}
        - Auth0__ClientId=${AUTH0_CLIENT_ID}
        - Auth0__Audience=${AUTH0_AUDIENCE}
    restart: always

volumes:
  rabbitmq_data:
