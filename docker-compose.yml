services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: always
    environment:
      - QDRANT__SERVICE__API_KEY=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - dokploy-network

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: asistente-rabbitmq
    restart: always
    environment:
      - RABBITMQ_DEFAULT_USER=admin
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASS:?RABBITMQ_PASS is required}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - dokploy-network

  apiservice:
    image: ghcr.io/${GITHUB_USER}/asistente-ayuntamiento-asistenteayuntamiento-apiservice:latest
    pull_policy: always
    container_name: asistente-api
    restart: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=apiservice
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production,deployment.environment=production
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__asistente-ayuntamiento-db=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASS}
      - ConnectionStrings__qdrant=Endpoint=${QDRANT_ENDPOINT:-http://qdrant:6334};Key=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - ConnectionStrings__messaging=amqp://admin:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
      - Ai__Chat__Provider=${AI_CHAT_PROVIDER:-google}
      - Auth0__Domain=${AUTH0_DOMAIN}
      - Auth0__ClientId=${AUTH0_CLIENT_ID}
      - Auth0__Audience=${AUTH0_AUDIENCE}
      - Auth0__ClientSecret=${AUTH0_CLIENT_SECRET}
      - Kestrel__Endpoints__Http__Url=http://+:${API_PORT:-8080}
      - Kestrel__Endpoints__Http__Protocols=Http1AndHttp2
      - Kestrel__Endpoints__Grpc__Url=http://+:50051
      - Kestrel__Endpoints__Grpc__Protocols=Http2
      - Ai__Chat__Model=${AI_CHAT_MODEL:-gemini-1.5-pro}
      - Ai__Chat__ApiKey=${GEMINI_API_KEY}
      # Estimated cost (EUR per 1M tokens) of the platform chat model; empty = cost 0 with a warning.
      - Ai__Pricing__${AI_CHAT_PROVIDER:-google}__${AI_CHAT_MODEL:-gemini-1.5-pro}__Input=${AI_CHAT_PRICE_INPUT_EUR:-}
      - Ai__Pricing__${AI_CHAT_PROVIDER:-google}__${AI_CHAT_MODEL:-gemini-1.5-pro}__Output=${AI_CHAT_PRICE_OUTPUT_EUR:-}
      - Ai__Embeddings__Provider=${AI_EMBEDDINGS_PROVIDER:-google}
      - Ai__Embeddings__Model=${AI_EMBEDDINGS_MODEL:-text-embedding-004}
      - Ai__Embeddings__ApiKey=${AI_EMBEDDINGS_API_KEY:-${GEMINI_API_KEY}}
      - Ai__Embeddings__EndpointUrl=${AI_EMBEDDINGS_ENDPOINT_URL:-}
      - Ai__Embeddings__ChunkMaxTokens=${AI_EMBEDDINGS_CHUNK_MAX_TOKENS:-400}
      - Ai__Embeddings__ChunkOverlapTokens=${AI_EMBEDDINGS_CHUNK_OVERLAP_TOKENS:-50}
      - Ai__Embeddings__ChunkMaxLines=${AI_EMBEDDINGS_CHUNK_MAX_LINES:-200}
      - Blob__Endpoint=${CLOUDFLARE_R2_ENDPOINT}
      - Blob__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - Blob__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - Blob__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
      - GoScraper__GrpcUrl=http://go-scraper:${SCRAPER_GRPC_PORT:-50051}
      - Internal__GrpcApiKey=${INTERNAL_GRPC_KEY:?INTERNAL_GRPC_KEY is required}
    depends_on:
      - rabbitmq
    networks:
      - dokploy-network
    extra_hosts:
      - "postgres:host-gateway"

  worker-baseline:
    image: ghcr.io/${GITHUB_USER}/asistente-ayuntamiento-asistenteayuntamiento-worker:latest
    pull_policy: always
    container_name: asistente-worker-baseline
    restart: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=worker-baseline
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production,deployment.environment=production
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_PIPELINE_MODE=BASELINE
      - ConnectionStrings__asistente-ayuntamiento-db=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASS}
      - ConnectionStrings__qdrant=Endpoint=${QDRANT_ENDPOINT:-http://qdrant:6334};Key=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - ConnectionStrings__messaging=amqp://admin:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
      - Ai__Chat__Provider=${AI_CHAT_PROVIDER:-google}
      - Ai__Chat__Model=${AI_CHAT_MODEL:-gemini-1.5-pro}
      - Ai__Chat__ApiKey=${GEMINI_API_KEY}
      - Ai__Embeddings__Provider=${AI_EMBEDDINGS_PROVIDER:-google}
      - Ai__Embeddings__Model=${AI_EMBEDDINGS_MODEL:-text-embedding-004}
      - Ai__Embeddings__ApiKey=${AI_EMBEDDINGS_API_KEY:-${GEMINI_API_KEY}}
      - Ai__Embeddings__EndpointUrl=${AI_EMBEDDINGS_ENDPOINT_URL:-}
      - Ai__Embeddings__ChunkMaxTokens=${AI_EMBEDDINGS_CHUNK_MAX_TOKENS:-400}
      - Ai__Embeddings__ChunkOverlapTokens=${AI_EMBEDDINGS_CHUNK_OVERLAP_TOKENS:-50}
      - Ai__Embeddings__ChunkMaxLines=${AI_EMBEDDINGS_CHUNK_MAX_LINES:-200}
      - Blob__Endpoint=${CLOUDFLARE_R2_ENDPOINT}
      - Blob__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - Blob__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - Blob__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
    depends_on:
      - rabbitmq
      - apiservice
    networks:
      - dokploy-network
    extra_hosts:
      - "postgres:host-gateway"

  worker-hierarchical:
    image: ghcr.io/${GITHUB_USER}/asistente-ayuntamiento-asistenteayuntamiento-worker:latest
    pull_policy: always
    container_name: asistente-worker-hierarchical
    restart: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=worker-hierarchical
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production,deployment.environment=production
      - ASPNETCORE_ENVIRONMENT=Production
      - WORKER_PIPELINE_MODE=HIERARCHICAL
      - ConnectionStrings__asistente-ayuntamiento-db=Host=${POSTGRES_HOST};Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASS}
      - ConnectionStrings__qdrant=Endpoint=${QDRANT_ENDPOINT:-http://qdrant:6334};Key=${QDRANT_API_KEY:?QDRANT_API_KEY is required}
      - ConnectionStrings__messaging=amqp://admin:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
      - Ai__Chat__Provider=${AI_CHAT_PROVIDER:-google}
      - Ai__Chat__Model=${AI_CHAT_MODEL:-gemini-1.5-pro}
      - Ai__Chat__ApiKey=${GEMINI_API_KEY}
      - Ai__Embeddings__Provider=${AI_EMBEDDINGS_PROVIDER:-google}
      - Ai__Embeddings__Model=${AI_EMBEDDINGS_MODEL:-text-embedding-004}
      - Ai__Embeddings__ApiKey=${AI_EMBEDDINGS_API_KEY:-${GEMINI_API_KEY}}
      - Ai__Embeddings__EndpointUrl=${AI_EMBEDDINGS_ENDPOINT_URL:-}
      - Ai__Embeddings__ChunkMaxTokens=${AI_EMBEDDINGS_CHUNK_MAX_TOKENS:-400}
      - Ai__Embeddings__ChunkOverlapTokens=${AI_EMBEDDINGS_CHUNK_OVERLAP_TOKENS:-50}
      - Ai__Embeddings__ChunkMaxLines=${AI_EMBEDDINGS_CHUNK_MAX_LINES:-200}
      - Blob__Endpoint=${CLOUDFLARE_R2_ENDPOINT}
      - Blob__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - Blob__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - Blob__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
    depends_on:
      - rabbitmq
      - apiservice
    networks:
      - dokploy-network
    extra_hosts:
      - "postgres:host-gateway"

  go-scraper:
    image: ghcr.io/${GITHUB_USER}/asistente-ayuntamiento-go-scraper:latest
    pull_policy: always
    container_name: asistente-scraper
    restart: always
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=go-scraper
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production,deployment.environment=production
      - PORT=${SCRAPER_PORT:-8080}
      - GRPC_PORT=${SCRAPER_GRPC_PORT:-50051}
      - ConnectionStrings__messaging=amqp://admin:${RABBITMQ_PASS:?RABBITMQ_PASS is required}@rabbitmq:5672
      - Blob__Endpoint=${CLOUDFLARE_R2_ENDPOINT}
      - Blob__AccessKeyId=${CLOUDFLARE_R2_ACCESS_KEY_ID}
      - Blob__SecretAccessKey=${CLOUDFLARE_R2_SECRET_ACCESS_KEY}
      - Blob__BucketName=${CLOUDFLARE_R2_BUCKET_NAME}
      - DOTNET_API_GRPC_URL=http://apiservice:50051
      - INTERNAL_GRPC_KEY=${INTERNAL_GRPC_KEY:?INTERNAL_GRPC_KEY is required}
    depends_on:
      - rabbitmq
      - apiservice
    networks:
      - dokploy-network

  gateway:
    image: ghcr.io/${GITHUB_USER}/asistente-ayuntamiento-asistenteayuntamiento-gateway:latest
    pull_policy: always
    container_name: asistente-gateway
    restart: always
    ports:
      - "${GATEWAY_PUBLISHED_PORT:-8080}:8080"
    environment:
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      - OTEL_EXPORTER_OTLP_HEADERS=${OTEL_EXPORTER_OTLP_HEADERS:-}
      - OTEL_SERVICE_NAME=gateway
      - OTEL_RESOURCE_ATTRIBUTES=deployment.environment.name=production,deployment.environment=production
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_HTTP_PORTS=8080
      - ReverseProxy__Clusters__apiservice-cluster__Destinations__destination1__Address=http://apiservice:${API_PORT:-8080}
      - DOTNET_SYSTEM_NET_HTTP_SOCKETSHTTPHANDLER_HTTP2UNENCRYPTEDSUPPORT=true
    depends_on:
      - apiservice
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true

volumes:
  rabbitmq_data:
  qdrant_data:
