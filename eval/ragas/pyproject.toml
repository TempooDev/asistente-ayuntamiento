[project]
name = "asistente-ragas-eval"
version = "0.1.0"
description = "Puntuación RAGAS y métricas deterministas del estudio de chunking"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ragas==0.3.9",
    "langchain-ollama==0.3.10",
    "langchain==0.3.30",
    "langchain-core==0.3.86",
    "langchain-community==0.3.31",
    "langchain-openai==0.3.35",
    "pandas==3.1.0",
    "datasets==5.1.0",
    "requests==2.34.2",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
