schema: spec-driven

context: |
  We are building "AsistenteAyuntamiento", a Retrieval-Augmented Generation (RAG) assistant for municipal staff
  over official bulletins (BOE, BOJA), orchestrated by .NET Aspire in development.

  ## Current Tech Stack

  ### Services
  - Frontend: Angular SPA (signals, OnPush, lazy routes; core/ shared/ features/), served by the YARP Gateway
  - API: ASP.NET Core (AsistenteAyuntamiento.ApiService) — minimal APIs, SignalR hubs (/hubs/chat, /hubs/notifications), gRPC
  - Ingestion workers: .NET Worker in BASELINE or HIERARCHICAL mode (Semantic Kernel)
  - Scraper: Go service (src/go-scraper, cmd/scraper) for BOE and BOJA; BOPMA is NOT active (Cloudflare Turnstile)

  ### Data & Storage
  - PostgreSQL (EF Core): users, chat, tenant AI configuration, job states, document chunks, parent/child fragments
    (full-text search on child fragments). The migration history is kept (production data must survive).
  - Vectors: Qdrant, collections document_chunks (baseline) and child_fragments (hierarchical), created on first write
  - Blob storage: S3-compatible bucket — MinIO in development, Cloudflare R2 in production
    (json/{SOURCE}/{id}.json parsed documents, raw-xml|raw-html/{SOURCE}/{id}.* originals)
  - Messaging: RabbitMQ — documents_to_process_{baseline,hierarchical} with .retry and .dlq queues, persistent
    messages and publisher confirms (docs/messaging-contract.md)

  ### AI / LLM
  - Chat model: per tenant (AiConfiguration): ollama, openai, openrouter or google; platform defaults in Ai:Chat:*
  - Tenant API keys: encrypted with ASP.NET Core Data Protection, write-only (never returned to clients)
  - Fallback on quota exhaustion (429): platform model with its own credentials (Ai:Fallback:*); tenant keys never leave their provider
  - Embeddings: platform-wide (Ai:Embeddings:*, default Ollama nomic-embed-text), never per tenant

  ### Auth & Identity
  - Auth0 B2B: organizations are tenants (org_id claim); roles in {namespace}/roles ('admin-plataforma' = shared knowledge base, 'admin-organizacion' = own tenant)
  - SPA: Auth0 Angular SDK with runtime config from /api/config/auth0; API: JWT bearer; hubs accept access_token in the query
  - Server-side authorization: named policies (Policies.PlatformAdmin / Policies.OrganizationAdmin) on every admin endpoint; client guards are UX only
  - Service-to-service gRPC (API <-> scraper) authenticated with a shared x-internal-key

  ## Domain Rules
  - Bulletin documents and vectors are GLOBAL — every tenant searches the same knowledge base
  - Chat sessions, messages, Arena battles and AI configuration are per TENANT and per USER (EF query filters;
    IgnoreQueryFilters only in allow-listed files with an explicit predicate)
  - Requests without a tenant are rejected outside Development
  - Two retrieval pipelines compete in the Arena (baseline vs hierarchical); the winner answers users and a sample
    gets a background shadow run

  ## Deployment
  - Dev: .NET Aspire AppHost (Postgres, RabbitMQ, Qdrant, MinIO, Ollama, Angular, Go)
  - Prod: Docker Compose on a VPS via Dokploy; images built by deploy.yml after CI passes on main, tagged sha-<short> and latest
  - CI: .NET (format, build, tests incl. Testcontainers), Angular (tests, build), Go (vet, gofmt, race tests), protos drift

  ## Conventions
  - Clean Architecture: Domain (no packages) <- Application (ports, no infrastructure SDKs) <- Infrastructure <- hosts;
    enforced by tests/AsistenteAyuntamiento.ArchitectureTests
  - Application services registered by AddApplicationServices(); ports implemented by AddInfrastructureServices()
  - Background work goes through IBackgroundWorkQueue (tracked, tenant-scoped), never Task.Run or discarded tasks
  - Endpoints and hubs only map transport to Application services; no EF Core in ApiService/Features
  - One public type per file, English identifiers, user-facing text in Spanish, structured logging, CancellationToken on async APIs
  - Central package versions (Directory.Packages.props); nullable warnings are errors
  - All secrets in environment variables / Aspire parameters — never in source code

rules:
  proposal:
    - Always include a "Non-goals" section
    - Scope changes to a single capability when possible
  tasks:
    - Break tasks into chunks of max 2-3 hours
    - Each task must reference the relevant source files it modifies
  spec:
    - All requirements must have at least one Scenario
    - Security-sensitive features must include a Scenario for the unauthorized/unauthenticated case
